[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "rea"
version = "0.1.0"
description = "Reverse Engineer Anything — modular, evidence-driven reverse-engineering framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TheBabelDragon", email = "noreply@example.com" },
]
keywords = ["reverse-engineering", "analysis", "evidence", "investigation", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-jsonschema",
]

[project.scripts]
rea = "rea.cli.main:app"

[project.urls]
Homepage = "https://github.com/TheBabelDragon/REA"
Repository = "https://github.com/TheBabelDragon/REA"
Issues = "https://github.com/TheBabelDragon/REA/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/rea"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["rea"]
mypy_path = "src"
