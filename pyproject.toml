[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "rea"
version = "0.2.1"
description = "Reverse Engineer Anything — modular, evidence-driven reverse-engineering framework"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TheBabelDragon", email = "noreply@example.com" }]
keywords = ["reverse-engineering", "analysis", "evidence", "investigation", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "rich>=13.7",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
rea = "rea.cli.main:app"

[project.urls]
Homepage = "https://github.com/TheBabelDragon/REA"
Repository = "https://github.com/TheBabelDragon/REA"

[tool.hatch.build.targets.wheel]
packages = ["src/rea"]

[tool.hatch.build]
dev-mode-dirs = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# CI focuses on correctness; style cleanups tracked separately.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line length — gradual fix
    "E741",  # ambiguous variable names in legacy samples
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
